<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Landing hero is the LCP element; without this it can't start downloading
       until React mounts. Scoped to "/" so deep links don't pay the 124KB. -->
  <script>if(location.pathname==='/'){var _p=document.createElement('link');_p.rel='preload';_p.as='image';_p.href='/images/v2_hero_kigali.webp';_p.fetchPriority='high';document.head.appendChild(_p);}</script>
  <link rel="apple-touch-icon" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BOA-Story" />

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="BOA-Story - A digital home for real, thoughtful stories about African lives, cities, and ideas." />
  
  <!-- Base Open Graph -->
  <meta property="og:site_name" content="BOA-Story" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BOA-Story" />
  <meta property="og:description" content="A digital home for real, thoughtful stories about African lives, cities, and ideas — beyond charity ads and disaster headlines." />
  <meta property="og:image" content="https://best-of-africa.pages.dev/og-default.jpg" />
  <meta property="og:url" content="https://best-of-africa.pages.dev" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BOA-Story" />
  <meta name="twitter:description" content="A digital home for real, thoughtful stories about African lives, cities, and ideas — beyond charity ads and disaster headlines." />
  <meta name="twitter:image" content="https://best-of-africa.pages.dev/og-default.jpg" />
  <meta name="twitter:url" content="https://best-of-africa.pages.dev" />
  
  <title>BOA-Story</title>
</head>

<body>
  <div id="root">
    <!-- Static above-the-fold hero: paints instantly from HTML (no JS), improving
         FCP/LCP. React's createRoot replaces #root's contents on mount. The inline
         script below removes it on non-landing deep links to avoid a wrong-page flash. -->
    <div id="boa-hero" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0F1F3D;color:#fff;padding:6rem 1.5rem;box-sizing:border-box;font-family:'Playfair Display',Georgia,serif;">
      <div style="font-family:Inter,system-ui,sans-serif;color:#C9A84C;font-weight:600;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:1.5rem;">— Early Access</div>
      <h1 style="font-size:clamp(4rem,9vw,8rem);line-height:.95;letter-spacing:-.04em;font-weight:900;margin:0 0 2rem;max-width:64rem;">Africa without the filter.</h1>
      <p style="font-family:Inter,system-ui,sans-serif;font-weight:300;font-size:clamp(1.125rem,2vw,1.5rem);line-height:1.6;max-width:42rem;color:rgba(255,255,255,.8);margin:0;">A digital home for real, thoughtful stories about African lives, cities, and ideas — beyond charity ads and disaster headlines.</p>
    </div>
  </div>
  <script>if(location.pathname!=='/'){var _h=document.getElementById('boa-hero');if(_h)_h.remove();}</script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered: ', reg))
          .catch(err => console.log('SW registration failed: ', err));
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
