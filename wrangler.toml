name = "best-of-africa-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ═══════════════════════════════════════════════════════════════════════════════
# D1 DATABASE - Articles, Users, Countries, Analytics
# ═══════════════════════════════════════════════════════════════════════════════
[[d1_databases]]
binding = "DB"
database_name = "best-of-africa-db"
database_id = "532cd4e1-1d5f-4562-a11a-561ec3fd8d77"
migrations_dir = "migrations"

# ═══════════════════════════════════════════════════════════════════════════════
# KV NAMESPACE - Sessions, Cache, Rate Limiting
# ═══════════════════════════════════════════════════════════════════════════════
[[kv_namespaces]]
binding = "CACHE"
id = "ad2a3549ed6f43d89c89c39bd4479860"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "0857fddd4ac44687ae11f58c009c3a87"

# ═══════════════════════════════════════════════════════════════════════════════
# R2 BUCKET - Media Storage (images, assets)
# ═══════════════════════════════════════════════════════════════════════════════
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "best-of-africa-media"

# ═══════════════════════════════════════════════════════════════════════════════
# VECTORIZE - Semantic Search & Narrative Gap Detection
# ═══════════════════════════════════════════════════════════════════════════════
[[vectorize]]
binding = "VECTORS"
index_name = "best-of-africa-content"

# ═══════════════════════════════════════════════════════════════════════════════
# QUEUES - Async Job Processing
# ═══════════════════════════════════════════════════════════════════════════════
[[queues.producers]]
binding = "CONTENT_QUEUE"
queue = "content-generation"

[[queues.producers]]
binding = "OPTIMIZATION_QUEUE"
queue = "headline-optimization"

[[queues.consumers]]
queue = "content-generation"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "headline-optimization"
max_batch_size = 10
max_batch_timeout = 30

# ═══════════════════════════════════════════════════════════════════════════════
# WORKERS AI - Article Generation & Embeddings
# ═══════════════════════════════════════════════════════════════════════════════
[ai]
binding = "AI"

# ═══════════════════════════════════════════════════════════════════════════════
# ANALYTICS ENGINE - Real-time User Behavior
# ═══════════════════════════════════════════════════════════════════════════════
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "best-of-africa-events"

# ═══════════════════════════════════════════════════════════════════════════════
# DURABLE OBJECTS - Live Counters & Real-time Aggregation
# ═══════════════════════════════════════════════════════════════════════════════
[[durable_objects.bindings]]
name = "LIVE_COUNTER"
class_name = "LiveCounter"

[[migrations]]
tag = "v1"
new_classes = ["LiveCounter"]

# ═══════════════════════════════════════════════════════════════════════════════
# SCHEDULED WORKERS (CRON)
# ═══════════════════════════════════════════════════════════════════════════════
[triggers]
crons = [
  "*/15 * * * *",  # Ingestion: Every 15 minutes
  "*/2 * * * *",   # Optimization: Every 2 minutes
  "0 5 * * *"      # Reporting: Daily at 5am UTC
]

# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ═══════════════════════════════════════════════════════════════════════════════
[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"

# Secrets (set via wrangler secret put):
# - JWT_SECRET
# - NEWS_API_KEY
# - ADMIN_API_KEY
